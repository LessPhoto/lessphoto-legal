<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LessPhoto Support</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #fff;
        color: #000;
        font-family: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
      }

      main {
        width: min(100%, 720px);
        margin: 0 auto;
        padding: 96px 28px;
      }

      a {
        color: #0070c9;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 36px;
        line-height: 1.12;
      }

      p {
        margin: 0 0 12px;
        font-size: 17px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>LessPhoto Support</h1>
      <p>For technical support, app issues, feedback, or feature requests, please contact:</p>
      <p>📧 Email：<a href="mailto:support@lessphoto.cc">support@lessphoto.cc</a></p>
    </main>
  </body>
</html>
