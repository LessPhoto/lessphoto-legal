<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LessPhoto Support</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #fff;
        color: #000;
        font-family: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
      }

      .top-bar {
        position: fixed;
        top: 0;
        left: 50%;
        width: 100%;
        max-width: 960px;
        height: 76px;
        padding: 16px 24px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #fff;
      }

      .icon-btn {
        border: 0;
        background: transparent;
        width: 44px;
        height: 44px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #000;
        cursor: pointer;
      }

      .menu-link {
        color: #000;
        text-decoration: none;
      }

      main {
        width: min(100%, 720px);
        margin: 0 auto;
        padding: 96px 28px;
      }

      a {
        color: #0070c9;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 36px;
        line-height: 1.12;
      }

      p {
        margin: 0 0 12px;
        font-size: 17px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <header class="top-bar">
      <a class="icon-btn" href="/" aria-label="Home">

        </svg>
      </a>
      <a class="icon-btn menu-link" href="/#/" aria-label="Menu">
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M33 30C33.5523 30 34 30.4477 34 31C34 31.5523 33.5523 32 33 32H11C10.4477 32 10 31.5523 10 31C10 30.4477 10.4477 30 11 30H33Z" fill="currentColor"></path>

      </a>
    </header>
    <main>
      <h1 id="supportTitle">LessPhoto Support</h1>
      <p id="supportDesc">For technical support, app issues, feedback, or feature requests, please contact:</p>
      <p id="supportEmail">📧 Email: <a href="mailto:support@lessphoto.cc">support@lessphoto.cc</a></p>
    </main>
    <script>
      const supportCopy = {
        en: {
          title: "LessPhoto Support",
          desc: "For technical support, app issues, feedback, or feature requests, please contact:",
          emailLabel: "📧 Email:",
        },
        "zh-CN": {
          title: "LessPhoto 技术支持",
          desc: "如需技术支持、问题反馈或功能建议，请联系：",
          emailLabel: "📧 电子邮箱：",
        },
        "zh-HK": {
          title: "LessPhoto 技術支援",
          desc: "如需技術支援、問題回饋或功能建議，請聯絡：",
          emailLabel: "📧 電子郵箱：",
        },
      };

      function detectSupportLang() {
        const queryLang = new URLSearchParams(window.location.search).get("lang");
        if (supportCopy[queryLang]) {
          return queryLang;
        }

        const languages = navigator.languages && navigator.languages.length > 0
          ? navigator.languages
          : [navigator.language || ""];

        for (const language of languages) {
          const normalized = language.toLowerCase();
          if (normalized.startsWith("zh-hant") || normalized.startsWith("zh-hk") || normalized.startsWith("zh-tw")) {
            return "zh-HK";
          }
          if (normalized.startsWith("zh")) {
            return "zh-CN";
          }
        }

        return "en";
      }

      const supportLang = detectSupportLang();
      const text = supportCopy[supportLang];
      document.documentElement.lang = supportLang;
      document.title = text.title;
      document.getElementById("supportTitle").textContent = text.title;
      document.getElementById("supportDesc").textContent = text.desc;
      document.getElementById("supportEmail").innerHTML = `${text.emailLabel} <a href="mailto:support@lessphoto.cc">support@lessphoto.cc</a>`;
    </script>
  </body>
</html>
