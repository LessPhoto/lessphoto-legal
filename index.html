    <div class="app-shell">
      <main class="page page-home hidden" id="homePage">
        <header class="top-bar">
          <button class="icon-btn logo-btn" id="goHomeBtn" type="button" aria-label="Home">
            <svg class="nav-logo-svg" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
              <use href="#shared-home-logo"></use>
            </svg>
          </button>
          <button class="icon-btn" id="openMenuBtn" type="button" aria-label="Open menu">
            <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
              <use href="#shared-menu-icon"></use>
            </svg>
          </button>
        </header>

        <section class="hero">
          <div class="app-icon-wrap">
            <div class="app-icon">
              <svg class="app-main-svg" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
                <use href="#shared-home-logo"></use>
              </svg>

            </div>
          </div>

          <h1 class="brand-name">LessPhoto</h1>
          <h2 class="hero-title" id="heroTitle"></h2>
          <p class="hero-desc" id="heroDesc"></p>
          <button class="download-btn" id="downloadBtn" type="button"></button>
        </section>
      </main>

      <main class="page page-doc hidden" id="docPage">
        <header class="top-bar">
          <button class="icon-btn logo-btn" id="docGoHomeBtn" type="button" aria-label="Home">
            <svg class="nav-logo-svg" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
              <use href="#shared-home-logo"></use>
            </svg>
          </button>
          <button class="icon-btn" id="docOpenMenuBtn" type="button" aria-label="Open menu">
            <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
              <use href="#shared-menu-icon"></use>
            </svg>
          </button>
        </header>

        <section class="doc-content">
          <article id="docMarkdown"></article>
        </section>
      </main>

      <div class="overlay hidden" id="menuOverlay">
        <button class="icon-btn close-btn" id="closeMenuBtn" type="button" aria-label="Close menu">
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
            <use href="#shared-close-icon"></use>
          </svg>
        </button>
        <div class="sheet">
          <div class="sheet-inner">
            <nav class="menu-list">
              <button class="menu-item active" data-route="home" id="menuHomeBtn" type="button"></button>
              <button class="menu-item" data-route="terms" id="menuTermsBtn" type="button"></button>
              <button class="menu-item" data-route="privacy" id="menuPrivacyBtn" type="button"></button>
              <button class="menu-item" data-route="support" id="menuSupportBtn" type="button"></button>
              <button class="menu-item language-item" id="openLangBtn" type="button">
                <span id="menuLanguageLabel"></span>
                <span class="lang-pill" id="currentLanguagePill"></span>
              </button>
            </nav>
          </div>
        </div>
      </div>

      <div class="overlay hidden" id="langOverlay">
        <button class="icon-btn close-btn" id="closeLangBtn" type="button" aria-label="Close language menu">
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
            <use href="#shared-close-icon"></use>
          </svg>
        </button>
        <div class="sheet">
          <div class="sheet-inner">
            <nav class="menu-list">
              <button class="menu-item" data-lang="en" type="button">English</button>
              <button class="menu-item" data-lang="zh-CN" type="button">简体中文</button>
              <button class="menu-item" data-lang="zh-HK" type="button">繁體中文</button>
            </nav>
          </div>
        </div>
      </div>
    </div>
