          </button>

            <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
              <use href="#shared-menu-icon"></use>
            </svg>
          </button>
        </header>

        <section class="doc-content">
          <article id="docMarkdown"></article>
        </section>

      <div class="overlay hidden" id="menuOverlay">

              <button class="menu-item" data-route="support" id="menuSupportBtn" type="button"></button>
              <button class="menu-item language-item" id="openLangBtn" type="button">
                <span id="menuLanguageLabel"></span>
                <span class="lang-pill" id="currentLanguagePill"></span>
              </button>
            </nav>
          </div>
        </div>
      </div>

      <div class="overlay hidden" id="langOverlay">
        <button class="icon-btn close-btn" id="closeLangBtn" type="button" aria-label="Close language menu">
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
            <use href="#shared-close-icon"></use>
          </svg>
        </button>
        <div class="sheet">
          <div class="sheet-inner">
            <nav class="menu-list">
              <button class="menu-item" data-lang="en" type="button">English</button>
              <button class="menu-item" data-lang="zh-CN" type="button">简体中文</button>
              <button class="menu-item" data-lang="zh-HK" type="button">繁體中文</button>
